name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        sdk: [3.9.4, 3.13.3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart tool/check.dart core packages benchmarks
      - name: Compile native PTY integration fixture and driver
        run: |
          dart compile exe test/process/fixtures/pty_process.dart -o pty-fixture.exe
          dart compile exe test/process/fixtures/pty_native_smoke.dart -o pty-smoke.exe
      - name: Verify native PTY sizing and resize under AOT
        run: ./pty-smoke.exe ./pty-fixture.exe
      - name: Compile native reference application
        run: dart compile exe example/task_manager_demo.dart -o cinder-demo.exe
      - name: Exercise a real terminal and restore its modes
        if: runner.os != 'Windows'
        run: python3 tool/terminal_smoke.py ./cinder-demo.exe
      - name: Validate the large reference workload and output stalls
        if: runner.os != 'Windows'
        run: |
          python3 -m unittest discover -s benchmark/runtime_scale -p 'test_*.py' -v
          python3 benchmark/runtime_scale/build.py --output build/scale-monitor
          python3 benchmark/runtime_scale/run_stress.py --seconds 10 --stall-ms 500 --output build/scale-smoke -- ./build/scale-monitor
      - uses: actions/upload-artifact@v4
        if: always() && runner.os != 'Windows'
        with:
          name: runtime-scale-${{ matrix.os }}-${{ matrix.sdk }}
          path: build/scale-smoke/
          if-no-files-found: ignore

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.3
      - run: dart pub get
      - run: dart tool/check.dart packages
      - run: dart tool/check.dart format package
      - name: Install Git packages as an external application
        run: dart tool/verify_git_installation.dart "$CINDER_COMMIT"
        env:
          CINDER_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
