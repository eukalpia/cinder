name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        sdk: [3.9.4, 3.12.0]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart tool/check.dart core packages benchmarks
      - name: Compile native reference application
        run: dart compile exe example/task_manager_demo.dart -o cinder-demo.exe
      - name: Exercise a real terminal and restore its modes
        if: runner.os != 'Windows'
        run: python3 tool/terminal_smoke.py ./cinder-demo.exe

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.0
      - run: dart pub get
      - run: dart tool/check.dart packages
      - run: dart tool/check.dart format package
