name: Benchmark

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.0
      - run: dart pub get
      - name: Enforce deterministic renderer work bounds
        run: dart tool/check.dart benchmarks
      - name: Record workload timings
        run: dart run benchmark/benchmark.dart --ci
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark/results.md
