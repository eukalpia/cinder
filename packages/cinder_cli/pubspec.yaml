name: cinder_cli
description: CLI tools for cinder - TUI framework for Dart
version: 1.0.0-rc.2
repository: https://github.com/eukalpia/cinder

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  args: ^2.7.0
  file: ^7.0.1
  meta: ^1.17.0
  cinder: ^1.0.0-rc.2
  scoped_deps: ^0.1.0+2
  yaml: ^3.1.3

dev_dependencies:
  lints: ^5.0.0
  mocktail: ^1.0.4
  test: ^1.24.0

executables:
  cinder: cinder_cli

dependency_overrides:
  cinder:
    path: ../..
